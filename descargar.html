<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hunting Log · Agenda de Caza — Descargar</title>
<meta name="description" content="Descarga la app de caza para iPhone y Android.">
<style>
  :root { --verde:#0b110d; --acento:#3f7d4e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,#0b110d 0%,#15241a 100%);
    color:#fff; min-height:100vh; display:flex; align-items:center;
    justify-content:center; text-align:center; padding:24px;
  }
  .card { max-width:440px; width:100%; }
  .logo {
    width:96px; height:96px; border-radius:22px; margin:0 auto 22px;
    background:#fff; display:flex; align-items:center; justify-content:center;
    font-size:46px; box-shadow:0 8px 30px rgba(0,0,0,.4);
  }
  h1 { font-size:1.7rem; margin-bottom:8px; }
  p.sub { color:#b9d4c2; margin-bottom:30px; font-size:1.05rem; line-height:1.45; }
  a.btn {
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:16px; margin-bottom:14px; border-radius:14px;
    text-decoration:none; font-weight:600; font-size:1.05rem;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  a.btn:active { transform:scale(.97); }
  .ios { background:#000; color:#fff; border:1px solid #333; }
  .android { background:#fff; color:#111; }
  .redir { color:#8fb89c; font-size:.9rem; margin-top:18px; }
  .foot { color:#6f8a78; font-size:.8rem; margin-top:34px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🎯</div>
    <h1 id="title">Descarga la app</h1>
    <p class="sub" id="subtitle">Tu cuaderno de caza digital: jornadas, mapas, especies, clima y mucho más.</p>

    <a class="btn ios" id="btn-ios" href="https://apps.apple.com/app/id6777485650"> App Store</a>
    <a class="btn android" id="btn-android" href="https://play.google.com/store/apps/details?id=com.agendadecaza.app">▶ Google Play</a>

    <p class="redir" id="redir"></p>
    <p class="foot">Hunting Log · Agenda de Caza</p>
  </div>

<script>
(function () {
  var IOS_URL = "https://apps.apple.com/app/id6777485650";
  var AND_URL = "https://play.google.com/store/apps/details?id=com.agendadecaza.app";

  // --- Detección de idioma ---
  var lang = (navigator.language || "en").slice(0,2).toLowerCase();
  var T = {
    es: { title:"Descarga la app",      sub:"Tu cuaderno de caza digital: jornadas, mapas, especies, clima y mucho más.", ios:" App Store", and:"▶ Google Play", redir:"Redirigiendo a tu tienda…" },
    en: { title:"Download the app",     sub:"Your digital hunting log: outings, maps, species, weather and much more.", ios:" App Store", and:"▶ Google Play", redir:"Redirecting to your store…" },
    fr: { title:"Téléchargez l'app",    sub:"Votre carnet de chasse numérique : sorties, cartes, espèces, météo et bien plus.", ios:" App Store", and:"▶ Google Play", redir:"Redirection vers votre store…" },
    de: { title:"Lade die App herunter",sub:"Dein digitales Jagdtagebuch: Ausgänge, Karten, Wildarten, Wetter und vieles mehr.", ios:" App Store", and:"▶ Google Play", redir:"Weiterleitung zu deinem Store…" }
  };
  var t = T[lang] || T.en;
  document.documentElement.lang = T[lang] ? lang : "en";
  document.getElementById("title").textContent    = t.title;
  document.getElementById("subtitle").textContent = t.sub;
  document.getElementById("btn-ios").textContent     = t.ios;
  document.getElementById("btn-android").textContent = t.and;

  // --- Detección de plataforma + redirección automática ---
  var ua = navigator.userAgent || navigator.vendor || "";
  var isIOS = /iPad|iPhone|iPod/.test(ua) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /android/i.test(ua);

  if (isIOS || isAndroid) {
    document.getElementById("redir").textContent = t.redir;
    setTimeout(function () {
      window.location.replace(isIOS ? IOS_URL : AND_URL);
    }, 900);
  }
})();
</script>
</body>
</html>
